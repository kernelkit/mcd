# /etc/mcd.conf: sample configuration
# Global settings first, then per-interface enable/disable.
# By default, mcd is disabled on all interfaces.

# Query interval [1,1024], default 125 sec.  Avoid going below 10.
#global-query-interval 125

# Max response time hosts get for a query [1,1024], default 10 sec.
#global-response-interval 10

# Last member query interval [1,1024], default 1 sec.  The robustness
# setting controls the last member query count.
#global-last-member-interval 1

# Querier's robustness [2,10], default 2.  Also sets the number of
# queries in the startup burst when mcd becomes querier.
#robustness 2

# Other querier present interval, used to detect when an elected
# querier stops sending queries.  Leave commented out unless you need
# to interoperate with devices that do not follow the RFC.  When unset
# the timeout is calculated from query interval and robustness per RFC.
#router-timeout 255

# IP Router Alert option is enabled by default, for interop with stacks
# that hard-code the length of the IP header.
#no router-alert

# General query when a bridge port starts forwarding, on by default.
# Hosts behind the port are back in the MDB within the response
# interval instead of at the next periodic query.
#no topology-query

# Enable the IGMP and MLD queriers, optionally with the versions to
# start with.  Default is igmpv3 and mldv2, with automatic fallback
# when older hosts appear.
#iface vlan1 enable
#iface vlan2 enable igmpv2 mldv1

# Run only one of the two queriers.
#iface vlan3 enable mld off

# Multicast Router Discovery, RFC 4286, for switches that learn their
# router ports from MRD advertisements rather than from queries.
#iface vlan3 enable mrd on

# Per-interface query interval, overrides global-query-interval.
#iface vlan4 enable query-interval 30

# Backup querier only: always send from 0.0.0.0, never win an election.
#iface vlan5 enable proxy-mode

# Static groups, joined in the kernel like a host would, never time out.
#iface vlan1 enable static-group 239.1.1.1 static-group ff05::1

# Raw VLAN mode: querier on VLAN 42 of a VLAN filtering bridge that has
# no vlan interface on top.  Always runs in proxy mode.
#iface br0 vlan 42 enable

# Include .conf snippets from /etc/mc.d/, works with any setting, but
# probably most useful for per-interface configuration.
include /etc/mc.d/*.conf
